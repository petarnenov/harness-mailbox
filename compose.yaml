services:
  dashboard:
    build: .
    user: "${DASHBOARD_USER:-65534:65534}"
    labels:
      io.harness-mailbox.root: ${MAILBOX_ROOT:?Set MAILBOX_ROOT to an existing mailbox data directory}
    ports:
      - "127.0.0.1:17171:8080"
    environment:
      MAILBOX_ROOT: /data
    volumes:
      - ${MAILBOX_ROOT:?Set MAILBOX_ROOT to an existing mailbox data directory}:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
